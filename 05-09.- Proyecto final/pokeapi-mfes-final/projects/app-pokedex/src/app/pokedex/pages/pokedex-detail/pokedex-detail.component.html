<div class="container mx-auto p-4 max-w-4xl">
    <h2 class="text-2xl md:text-3xl font-bold mb-6 text-center md:text-left">Detalle del Pokémon</h2>

    <div *ngIf="pokemon()" class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
        <div class="flex flex-col md:flex-row md:items-center">
            <!-- Sección de imagen -->
            <div class="md:w-1/3 flex justify-center items-center mb-6 md:mb-0">
                <img [src]="pokemon().sprites.front_default" [alt]="pokemon().name"
                    class="w-40 h-40 object-contain transition-transform hover:scale-110" />
            </div>

            <!-- Sección de información -->
            <div class="md:w-2/3 md:pl-8">
                <h3 class="text-xl md:text-2xl font-semibold mb-4 text-center md:text-left">
                    {{ pokemon().name | titlecase }}
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <p class="bg-gray-50 p-3 rounded-lg"><strong>Altura:</strong> {{ pokemon().height / 10 }} m</p>
                    <p class="bg-gray-50 p-3 rounded-lg"><strong>Peso:</strong> {{ pokemon().weight / 10 }} kg</p>
                    <p class="bg-gray-50 p-3 rounded-lg"><strong>Experiencia base:</strong> {{ pokemon().base_experience
                        }}</p>
                    <p class="bg-gray-50 p-3 rounded-lg" *ngIf="pokemon().id"><strong>ID:</strong> #{{ pokemon().id }}
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="!pokemon()" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-500 text-lg">Cargando información del Pokémon...</p>
    </div>
</div>
